name: codex-triage bug
description: Report a problem in the triage CLI or matcher
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: codex-triage version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, WSL]
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
