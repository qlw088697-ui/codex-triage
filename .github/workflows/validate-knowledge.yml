name: validate-knowledge
on:
  pull_request:
    paths:
      - "knowledge/**"
      - "tests/knowledge.test.ts"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test -- tests/knowledge.test.ts
