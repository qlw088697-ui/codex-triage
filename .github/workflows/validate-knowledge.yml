name: validate-knowledge

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "src/knowledge/**"
      - "tests/knowledge.test.mjs"
      - "tests/knowledge-contract.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - run: node --test tests/knowledge.test.mjs tests/knowledge-contract.test.mjs
