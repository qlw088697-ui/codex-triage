name: validate-knowledge

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "src/knowledge/**"
      - "tests/knowledge.test.mjs"
      - "tests/knowledge-contract.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - run: node --test tests/knowledge.test.mjs tests/knowledge-contract.test.mjs
