name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 20/22 keep the canonical "test (N)" names required by the
        # repository rules; every other combination gets an informational name.
        include:
          - { name: "test (20)", os: ubuntu-latest, node: 20 }
          - { name: "test (22)", os: ubuntu-latest, node: 22 }
          - { name: "test (24)", os: ubuntu-latest, node: 24 }
          - { name: "test (windows, 20)", os: windows-latest, node: 20 }
          - { name: "test (windows, 22)", os: windows-latest, node: 22 }
          - { name: "test (windows, 24)", os: windows-latest, node: 24 }
          - { name: "test (macos, 20)", os: macos-latest, node: 20 }
          - { name: "test (macos, 22)", os: macos-latest, node: 22 }
          - { name: "test (macos, 24)", os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.js --help
      - run: node dist/cli.js --version
      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run coverage:check
      - name: Secret scan
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run scan:secrets
      - name: Pack and install smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run pack:smoke
      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run --json
