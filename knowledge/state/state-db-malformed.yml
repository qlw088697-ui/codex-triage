        "动任何文件之前，先完整备份 ~/.codex 目录。",
        "让 Codex 自动恢复机制把损坏库移走重建；删任何文件前先跑 PRAGMA integrity_check 确认。",
        "避免把 CODEX_HOME 放在 NFS 或网络盘上，并跟进上游 WAL 损坏 Issue。"
