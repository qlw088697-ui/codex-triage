  "summary": "After a Codex Desktop update on macOS, new sessions fail with an invalid configuration error referencing service_tier in config.toml.",
  "explanation": "Reported as a macOS Codex Desktop update regression: an older service_tier entry in config.toml is rejected by the newer build, blocking new sessions until the key is removed or corrected. Upstream closed the report as completed in August 2026, so this rule now mainly matches older Codex Desktop builds that predate the fix.",
  "actions": [
    "Open ~/.codex/config.toml and find the service_tier entry.",
    "Remove or comment out the service_tier line, then restart Codex.",
    "If sessions still fail, compare your config against the upstream issue for the expected schema."
  ],
