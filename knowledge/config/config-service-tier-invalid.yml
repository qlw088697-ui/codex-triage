  "summary": "After a Codex Desktop update on macOS, new sessions fail with an invalid configuration error referencing service_tier in config.toml.",
  "explanation": "Reported as a macOS Codex Desktop update regression: an older service_tier entry in config.toml is rejected by the newer build, blocking new sessions until the key is removed or corrected.",
