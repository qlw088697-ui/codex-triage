  "i18n": {
    "zh-CN": {
      "title": "WSL CLI 共享 /mnt/c 上的 Windows App 状态时报告数据库损坏",
      "summary": "WSL 里的 CLI 共享 Windows Codex App 存放在 /mnt/c/Users/<user>/.codex 的状态时，Windows 盘挂载上的 SQLite 数据库被报告损坏，Codex 拒绝启动。",
      "explanation": "/mnt/c 的 DrvFs/9p 挂载上跑 SQLite 不可靠——上游怀疑 WAL 损坏时也指向同一文件系统因素。Windows 与 WSL 跨挂载写同一个状态库，就会出现指向 /mnt/c 路径的 'local database appears to be damaged' 错误。",
      "actions": [
        "先备份状态目录，再做任何操作。",
        "给 WSL 独立的 CODEX_HOME，放在 WSL 原生 Linux 文件系统（如 WSL 内的 ~/.codex），不再共享 Windows App 状态。",
        "移动后需要在 WSL 内重新登录；Windows 侧的会话历史留在 Windows 安装里。",
        "项目也建议放在 WSL 原生文件系统——/mnt/c 对状态和工作树都又慢又脆。"
      ]
    }
  }
