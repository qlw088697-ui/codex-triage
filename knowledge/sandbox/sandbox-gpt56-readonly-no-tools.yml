  "summary": "With any GPT-5.6 model, read-only sandbox sessions receive no tool bundle at all, so the model reports it has no shell or file-reading tool and read-only automation silently degrades to plain chat.",
  "explanation": "The reproduction matrix isolates the trigger to the model/sandbox combination: gpt-5.6-sol and gpt-5.6-terra under read-only report no tools, while the same models under workspace-write and gpt-5.5 under read-only both execute commands normally. Raising sandbox permissions (disk-full-read-access) does not help, and identical CLI versions behave differently only by model - so this is model provisioning, not a CLI or permission misconfiguration. The reporter is on the ChatGPT desktop local load balancer, so a backend/rollout-side cause is likely; it was filed within hours of the GPT-5.6 GA rollout and shares the unvalidated-gpt-5.6-metadata theme of openai/codex#31882.",
  "actions": [
    "For read-only runs use -m gpt-5.5, or switch the session to -s workspace-write; both are confirmed working in the reproduction matrix.",
    "Do not chase permissions: adding sandbox_permissions=[\"disk-full-read-access\"] was tested and does not provision tools.",
    "Track the upstream issue - the fix belongs in GPT-5.6 tool provisioning for read-only sandboxes."
  ],
