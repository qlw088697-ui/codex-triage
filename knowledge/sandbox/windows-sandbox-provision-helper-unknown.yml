        "动 EDR 之前先拉上安全团队：给 Codex 运行时路径加排除是合理的修法候选，但报告中未验证。",
        "别再反复重启或修复：重启、应用修复、所有权检查、给 CodexSandboxUsers 显式 ACL 授权在报告里全部验证为干净。",
        "向上游报告时附上 doctor 的沙箱供给段落和准确的 CreateProcess 拒绝消息。"
