  "summary": "On the Windows elevated sandbox, a custom permission profile that denies \":root\" and reopens a single readable root does not actually prevent reads outside that root - files outside the allowed root can still be read and their contents returned to the model, while write restrictions from the same profile are enforced.",
  "explanation": "The report verifies the profile is parsed and selected correctly: the elevated Windows backend provisions, the process runs under the dedicated CodexSandboxOffline account, network is disabled, and write restrictions hold - only the read restriction leaks. It reproduces through the normal codex exec path including --strict-config (not just the desktop UI), on desktop package 26.831.1445.0 with bundled CLI 0.152.0. Practical meaning: on Windows today, the deny entry for :root in a permission profile must not be trusted for read confidentiality - anything the sandboxed user can read may reach the model even when the profile says otherwise.",
  "actions": [
    "Do not rely on the \":root\" = \"deny\" profile entry for read confidentiality on Windows - enforce confidentiality with real NTFS permissions for the sandbox account, or keep secrets outside any path the sandboxed user can read.",
    "Writes from the same profile are enforced - the leak is read-only, so triage which readable locations contain material that must not reach the model.",
    "Track the upstream issue for the enforcement fix; reproducing it needs only codex exec with --strict-config and a minimal deny-root profile."
  ],
