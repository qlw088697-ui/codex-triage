      "explanation": "报告验证了档位被正确解析和选中：elevated Windows 后端正常供给、进程运行在专用 CodexSandboxOffline 账户下、网络已禁用、写入限制成立——只有读取限制在泄漏。它经由普通 codex exec 路径复现（含 --strict-config，不只是桌面 UI），环境为桌面包 26.831.1445.0 + 内置 CLI 0.152.0。实际含义：在今天的 Windows 上，权限档位里对 :root 的 deny 条目不能拿来保证读取机密性——沙箱账户读得到的任何东西都可能进模型，即使档位写的是相反。",
