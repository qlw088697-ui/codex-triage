  "summary": "On affected Windows PCs, local tools fail with 'code-mode host exited during handshake' or 'orchestrator_helper_exit_nonzero' carrying exit code -1073741502 (0xC0000142, STATUS_DLL_INIT_FAILED): a sandbox helper process cannot initialize its DLLs, so commands die before doing anything - machine-specific, surviving reboot and app repair.",
  "explanation": "0xC0000142 is the classic STATUS_DLL_INIT_FAILED: a process launched but its DLL initialization was aborted. The report pins the shape: one or two commands briefly succeed after a restart, then failures return; the identical app works on the reporter's notebook; the app is current and neither a Windows reboot nor a Windows Settings repair changed anything. Exit code -1073741502 (signed for 0xC0000142) on a helper that starts and immediately dies is the signature of DLL initialization being blocked or broken on that specific machine - classically antivirus/EDR injection into newly spawned processes or damaged system DLLs - rather than a Codex logic bug. Reported from ChatGPT desktop 26.901.22334 on Windows 11 with a Feedback ID attached.",
  "actions": [
    "Treat the machine, not Codex, as the suspect: the report verifies the same app version works on another PC and that reboot plus Repair do not help - reinstalling Codex again will not fix a DLL-init failure.",
    "Check what injects into new processes on this PC: antivirus/EDR product, DLL-injection utilities, or overlay/export proxies are the classic blockers of helper DLL initialization; loop in your security team before disabling anything.",
    "Capture Process Monitor or the sandbox log around one failing launch - the DLL that fails to initialize identifies the interfering component.",
    "Report upstream with the Feedback ID and the failing helper name; this is distinct from the machine-specific handshake-path bug, though both surface as local-tool failures."
  ],
