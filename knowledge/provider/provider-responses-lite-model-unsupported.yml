  "id": "provider-responses-lite-model-unsupported",
  "title": "ChatGPT route rejects the model as unsupported under Responses-Lite",
  "category": "provider",
  "severity": "high",
  "lastVerified": "2026-08-30",
  "source": "https://github.com/openai/codex/issues/31150",
  "match": {
    "any": [
