  "summary": "With ChatGPT-account sign-in on the official backend, catalog metadata routes the selected model (typically gpt-5.5) into the Responses-Lite transport that no longer accepts it; every request fails with 400 unsupported_value before any response is produced.",
  "explanation": "The local model catalog marks the failing model with use_responses_lite=true while working models (gpt-5.4, gpt-5.4-mini) are false, so the client adds the Responses-Lite header and the ChatGPT backend rejects the combination - a server-side routing/catalog regression, not a local misconfiguration. Reports span Codex Desktop and CLI on Windows across 0.142.x and later; the same account can work on other OSes, and one reporter saw gpt-5.5 work earlier the same day, so availability shifted server-side. Re-login does not help and VPN/proxy changes do not change the result. Note the sibling failure mode: if the error instead says Responses-Lite only supports function tools, that is the custom-provider transport rule.",
  "actions": [
    "Switch to gpt-5.4 or gpt-5.4-mini - confirmed working on the same machine and account in every report.",
    "Optional and unverified for this route: set use_responses_lite=false for the model in a local catalog via model_catalog_json, the same mechanism verified for custom providers in openai/codex#31882 - the header is added client-side from catalog metadata, so suppressing it should route the request normally.",
    "Skip credential churn: logout/login and network changes were tested and do not affect this failure.",
    "Track the upstream cluster for the routing fix."
  ],
