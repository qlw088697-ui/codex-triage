      "explanation": "损坏发生在模型响应生成阶段，而不是 shell 内部：工具调用里出现不存在的路径（如 /u001zeni/...）和 SKUL.md（应为 SKILL.md），模型承认并\"修正\"后，紧接着的下一次调用又把同样的值写坏。这是有持久化证据的，不是渲染故障——损坏的参数已经作为 response_item/custom_tool_call 记录存进 rollout JSONL。上下文压力已排除：两次失败时会话都只用了约 21% 的 828,400 窗口，附近也没有流断连、重试或压缩事件。目前是单份详细报告，尚无确定性复现步骤。",
