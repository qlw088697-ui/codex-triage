  "summary": "In a long tool-heavy gpt-5.6-sol session at high reasoning effort, generated tool calls start containing corrupted working directories and filenames (even after the model explicitly says it corrected them), and the TUI streams repetitive pseudo-language until interrupted.",
  "explanation": "The corruption happens during model response generation, not inside the shell: nonexistent paths like /u001zeni/... and SKUL.md instead of SKILL.md appear in tool calls, the model acknowledges and 'fixes' them, and the very next call corrupts the same values again. It is persisted evidence, not a rendering glitch - the corrupted arguments are stored in the rollout JSONL as response_item/custom_tool_call records. Context pressure is ruled out: the session was at roughly 21% of an 828,400-token window at both failures, with no stream disconnects, retries, or compaction events around the affected turns. Single detailed report, no deterministic reproducer yet.",
  "actions": [
    "Interrupt the turn and continue in a fresh thread - the reporter recovered by interrupting; degeneration persisted within the same thread.",
    "Do not chase context or memory: usage was ~21% with no compaction or retry events nearby.",
    "When reporting upstream, attach the session/thread ID and the rollout JSONL - the corrupted tool-call arguments are persisted there as response_item/custom_tool_call records, which is exactly the evidence maintainers need."
  ],
