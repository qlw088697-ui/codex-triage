{
  "schemaVersion": 2,
  "id": "provider-chatgpt-only-tool-transport",
  "title": "Custom providers reject gpt-5.6 requests built for the ChatGPT backend",
  "category": "provider",
  "severity": "high",
  "lastVerified": "2026-08-30",
  "source": "https://github.com/openai/codex/issues/31882",
  "match": {
    "any": [
      {
        "contains": "X-OpenAI-Internal-Codex-Responses-Lite only supports"
      },
      {
        "contains": "Namespace 'collaboration' is reserved"
      }
    ],
    "all": []
  },
  "summary": "The bundled model catalog hardcodes ChatGPT-backend transport flags for gpt-5.6-sol/terra/luna, so Azure and other custom providers receive Responses-Lite headers and collaboration namespace tools they never advertised and reject the request with a 400.",
  "explanation": "The models.json compiled into the CLI ships use_responses_lite/multi_agent_version/tool_mode: code_mode_only for the gpt-5.6 entries unconditionally, and custom providers never refresh the catalog, so the flags cannot be overridden remotely. Azure rejects both shapes: the Responses-Lite header (code unsupported_value) and, once that is disabled, the collaboration namespace (reserved for encrypted tool use). Doctor checks typically look healthy because auth and connectivity are fine - the provider rejects the request shape itself. Verified with plain chat and real tool calls after the local-catalog workaround.",
  "actions": [
    "Point model_catalog_json in config.toml at a local catalog copy where the gpt-5.6 entries set use_responses_lite=false and multi_agent_version=null; this resolves both errors end-to-end but drifts when the bundled catalog updates upstream.",
    "Watch the upstream issue for the real fix: gating Responses-Lite and collaboration transport on whether the active provider actually talks to the ChatGPT backend.",
    "If you only hit the collaboration error after forcing Responses-Lite off, both failures share this root cause - apply the same catalog override."
  ],
  "links": [
    {
      "type": "github_issue",
      "url": "https://github.com/openai/codex/issues/31882",
      "label": "openai/codex#31882"
    },
    {
      "type": "github_issue",
      "url": "https://github.com/openai/codex/issues/31843",
      "label": "openai/codex#31843"
    }
  ],
  "tags": [
    "provider",
    "azure",
    "gpt-5.6",
    "responses-lite",
