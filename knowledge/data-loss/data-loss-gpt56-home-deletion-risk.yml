  "summary": "A thoroughly documented report describes ~221 GB permanently unlinked from $HOME on macOS while gpt-5.6-sol sessions ran with approval_policy=never and --approve-for-me escalations - bypassing the Trash under the user's own privileges. The report matches the July GPT-5.6 Sol temporary-directory deletion failure mode (#19202, #38312), though it does not prove Codex performed the deletion.",
  "explanation": "The report is unusually rigorous: a full timeline, surviving client rollouts listing only benign review commands, and a unified-log window showing NO sandbox file-write-unlink denial from any process - meaning whatever deleted the data ran with full filesystem access, the exact condition OpenAI described in July for GPT-5.6 Sol deleting $HOME while handling a temporary directory. What the evidence cannot show: whether a command executed unsandboxed after automatic approval, or activity from paths that write no rollout (sub-agents, background PTYs, Desktop threads, automations). Treat this as a documented risk pattern, not a confirmed mechanism: rollouts surviving in ~/.codex/sessions and the matching TempDir cleanup window are the strongest correlation on record.",
  "actions": [
    "Do not run gpt-5.6 sessions with approval_policy=never or --approve-for-me in workspaces adjacent to $HOME contents; keep real work in dedicated deep directories and point TMPDIR somewhere expendable before long autonomous runs.",
    "Take a real backup before any long unattended gpt-5.6 session - the report's losses (repositories, ~/.nvm, ~/.config, ~/.zshrc, Docker stack data under ~/prod ~/uat ~/test, runners) bypassed the Trash and are unrecoverable.",
    "If you were hit: preserve ~/.codex/sessions rollouts immediately, then check the macOS unified log for sandbox file-write-unlink denials in the window - their absence indicates the actor ran unsandboxed, which is the key evidence upstream asks for.",
    "Track the upstream report and the July predecessors for the mechanism confirmation and fix."
