      "explanation": "这是桌面版一侧的客户端/服务端契约回归，确切错误是 'Invalid request: invalid type: string \":workspace\", expected internally tagged enum PermissionProfileSelectionParams'。报告者排除了三个本地原因：App 已更新到最新的 Microsoft Store 包、用 Reset-AppxPackage 重置了应用数据、~/.codex/config.toml 里没有自定义 default_permissions = \":workspace\"——但 Windows 11 x64（Desktop 26.820.7780.0，企业计划）上所有新旧聊天依然全部失败。\"GPT-5.6 从选择器消失 + 这个类型错误\"的组合指向相关 issue 里追踪的桌面版选择器/会话/权限状态回归。",
