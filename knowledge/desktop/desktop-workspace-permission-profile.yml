  "summary": "Codex Desktop sends the built-in \":workspace\" permission profile as a plain string where the backend now expects an internally tagged enum, so every chat - new and resumed - fails immediately and GPT-5.6 models vanish from the picker.",
  "explanation": "The failure is a client/server contract regression on the Desktop side: the exact error is 'Invalid request: invalid type: string \":workspace\", expected internally tagged enum PermissionProfileSelectionParams'. The reporter ruled out the three local causes: the app was updated to the latest Microsoft Store package, app data was reset with Reset-AppxPackage, and ~/.codex/config.toml contains no custom default_permissions = \":workspace\" - yet every new and existing chat still fails on Windows 11 x64 (Desktop 26.820.7780.0, enterprise plan). The combination of a vanished GPT-5.6 picker entry plus this type error points at the Desktop picker/session/permission-state regressions tracked in the related issues.",
  "actions": [
    "Cheap sanity check first: confirm ~/.codex/config.toml has no custom default_permissions setting - a local override could produce the same error shape (it was absent in the reference report).",
    "Do not keep reinstalling: both a Store update and a full app-data reset were verified insufficient in the report; this needs a client fix.",
    "Track the upstream issue and the related Desktop picker/session regressions for the fix release."
  ],
