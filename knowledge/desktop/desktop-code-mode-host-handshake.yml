  "summary": "On affected machines, Codex Desktop cannot execute local tools with GPT-5.6 models: every command fails during the code-mode host handshake, while GPT-5.5 in Desktop and the same GPT-5.6 models through the CLI work on the same machine and account.",
  "explanation": "The A/B matrix in the most detailed report rules out the usual suspects: same codex.exe SHA256 works on a second identical Windows PC; the code-mode host binary exists with a valid OpenAI signature and executable ACLs and runs manually; the app-server stdio initialization and the WebSocket upgrade (HTTP 101) both succeed; a reduced skills tree still fails. The failure is specific to the Desktop -> app-server -> GPT-5.6 -> code-mode host handshake path and is machine-specific rather than account- or binary-specific. Reported from Codex Desktop 26.820.x with codex-cli 0.149.1 on Windows 11; CLI execution of gpt-5.6-luna and gpt-5.6-sol works throughout. GPT-5.6 models run their tools through the code-mode host, which is why GPT-5.5 Desktop is unaffected.",
  "actions": [
    "Run GPT-5.6 tasks through the CLI - confirmed working on the same affected machine.",
    "Stay on GPT-5.5 inside Codex Desktop for tool-using work until the handshake path is fixed.",
    "Do not reinstall or re-verify the binary: signature, ACL, SHA256, WebSocket, and app-server checks were all clean in the report; reinstalling does not address a handshake-path bug.",
    "When filing upstream, include a Feedback ID and the desktop evidence package - machine-specific handshake failures need side-by-side traces from an affected and a working PC."
  ],
