        "contains": "rg is not usable in this shell"
      }
    ],
    "all": []
  },
  "summary": "On Windows, Codex reports that ripgrep is not usable in the current shell and silently falls back to slower PowerShell file search, usually because an rg.exe from the user PATH shadows the bundled binary.",
  "explanation": "Upstream reports describe the Desktop/CLI resolving rg from the user PATH before the Codex-bundled ripgrep; a broken or incompatible rg.exe on PATH then makes the shell declare it unusable even though rg works outside Codex.",
  "actions": [
    "Run rg --version in the same shell Codex uses and confirm which rg.exe resolves (where rg).",
    "Remove or rename the conflicting user-PATH rg.exe, or update it, so the bundled binary wins.",
    "Restart Codex and confirm search no longer reports the fallback."
  ],
  "links": [
