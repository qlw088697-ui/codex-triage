      "title": "ripgrep 在当前 shell 不可用（回退到 PowerShell 搜索）",
      "summary": "Windows 上 Codex 报告 ripgrep 在当前 shell 不可用，静默回退到较慢的 PowerShell 文件搜索；常见原因是用户 PATH 里的 rg.exe 遮蔽了内置版本。",
      "explanation": "上游报告：Desktop/CLI 先从用户 PATH 解析 rg，PATH 上损坏或不兼容的 rg.exe 会让 shell 判定其不可用——尽管 rg 在 Codex 之外工作正常。",
      "actions": [
        "在 Codex 使用的同一个 shell 里运行 rg --version，用 where rg 确认解析到的是哪个 rg.exe。",
        "移除或改名 PATH 上冲突的 rg.exe（或升级它），让内置二进制生效。",
        "重启 Codex，确认搜索不再报回退。"
