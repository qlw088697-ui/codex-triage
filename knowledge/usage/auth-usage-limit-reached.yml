  "summary": "Codex blocks requests with the usage-limit message. On paid plans this can still be plan confusion or one of the known metering bugs: limits draining without activity, or a reset window exhausting immediately.",
  "explanation": "Upstream reports include limits draining with no corresponding activity, Pro plans immediately shown as exhausted, and reset windows spent within minutes. First confirm the limit is real by checking the plan usage page before treating it as a technical failure.",
  "actions": [
    "Check the plan usage page in ChatGPT settings to confirm the remaining allowance.",
    "Wait for the 5-hour or weekly window to reset; on ChatGPT plans try codex rate-limit reset where available.",
    "If the limit drains without activity or resets and instantly exhausts, compare against the upstream metering issues.",
    "API-key users: rate limits depend on account billing tier, not the ChatGPT plan."
  ],
