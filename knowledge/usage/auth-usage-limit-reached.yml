  "summary": "Codex blocks requests with the usage-limit message. On paid plans this can still be plan confusion or one of the known metering bugs: limits draining without activity, a reset window exhausting immediately, or GPT-5.6 Sol burning most of a 5-hour Plus window in a single turn.",
  "explanation": "Upstream reports include limits draining with no corresponding activity, Pro plans immediately shown as exhausted, and reset windows spent within minutes. On Plus with gpt-5.6 Sol the burn rate itself is the complaint: one ~15k-character structured prompt on Sol Max consumed the entire 5-hour window (openai/codex#41518), one 6-minute lightweight task on Sol High consumed ~60% (#41468), and Work mode reached ~90% in 13 minutes without producing the artifact (#41330) - consumption correlates with model and reasoning effort, not wall-clock time. First confirm the limit is real by checking the plan usage page before treating it as a technical failure. The sharpest metering evidence on record (openai/codex#42912, September 2026): timestamped screenshots show a freshly reset 5-hour window draining from 58% to 17% remaining within about half an hour of complete idleness on Plus/macOS, with the desktop and web usage pages agreeing on the numbers.",
  "actions": [
    "Check the plan usage page in ChatGPT settings to confirm the remaining allowance.",
    "Wait for the 5-hour or weekly window to reset; on ChatGPT plans try codex rate-limit reset where available.",
    "If the limit drains without activity or resets and instantly exhausts, compare against the upstream metering issues.",
    "On Plus with gpt-5.6 Sol High/Max, expect a drastically faster 5-hour drain than earlier models - a single long structured prompt can consume most or all of the window; compare burned quota against what the turn actually produced before assuming a metering bug.",
    "API-key users: rate limits depend on account billing tier, not the ChatGPT plan."
  ],
