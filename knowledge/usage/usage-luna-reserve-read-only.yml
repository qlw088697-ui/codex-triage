  "summary": "After the regular allowance is exhausted, Luna Reserve keeps reading files, running commands, and reasoning - but every managed file-edit/apply_patch operation is rejected with 'rejected due to the Codex usage limit', making Reserve effectively read-only for coding work.",
  "explanation": "The report pins the split precisely: reads, inspection, command execution, and reasoning all continue under Reserve, while the managed file-edit operation alone is rejected with the usage-limit message. It reproduces in a fresh thread started directly with Luna Reserve and in a thread that switched to Reserve mid-session, so it is not a stale-session artifact. Whether this split is intended Reserve behavior or an accounting bug is not established upstream. Practical meaning: during a Reserve window, plan read-only work (review, analysis, planning) and defer edits until the regular allowance resets.",
  "actions": [
    "Plan around it: during a Reserve window, use the session for reading, analysis, and preparing edits, then apply changes after the regular allowance resets.",
    "Do not re-prompt the edit or retry apply_patch - the rejection is account-level, not a tool or permission failure.",
    "Compare against the usage page to confirm the regular allowance is exhausted while Reserve is active before reporting upstream."
  ],
